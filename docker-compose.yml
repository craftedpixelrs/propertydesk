# PropertyDesk multi-host stack (single VPS, non-swarm).
#
#   app         → propertydesk.app + my.propertydesk.app  (real product)
#   app-demo    → demo.propertydesk.app                   (seeded demo DB)
#   app-staging → staging.propertydesk.app (same DB + files as demo)
#   caddy       → TLS + reverse proxy
#
# Same GHCR image for every app container. Per-host origin comes from
# the env file. demo and staging share DATABASE_URL and the demo
# storage volume so WIP on staging. sees the same tenants as demo.
# See docs/environments.md.

services:
  app:
    image: ${IMAGE:-propertydesk-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE}
        NEXT_PUBLIC_APP_TIMEZONE: ${NEXT_PUBLIC_APP_TIMEZONE}
        NEXT_PUBLIC_MY_APP_URL: ${NEXT_PUBLIC_MY_APP_URL}
        NEXT_PUBLIC_LOOPS_FORM_ID: ${NEXT_PUBLIC_LOOPS_FORM_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_GOOGLE_APPOINTMENT_URL: ${NEXT_PUBLIC_GOOGLE_APPOINTMENT_URL:-}
        NEXT_PUBLIC_PRODUCT_VIDEO_URL: ${NEXT_PUBLIC_PRODUCT_VIDEO_URL:-}
    container_name: propertydesk-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    volumes:
      - app_storage:/app/storage
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  app-demo:
    image: ${IMAGE:-propertydesk-app:latest}
    container_name: propertydesk-app-demo
    restart: unless-stopped
    env_file:
      - .env.demo
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    volumes:
      - app_demo_storage:/app/storage
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  app-staging:
    image: ${IMAGE:-propertydesk-app:latest}
    container_name: propertydesk-app-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    volumes:
      - app_demo_storage:/app/storage
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: propertydesk-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  app_storage:
  app_demo_storage:
